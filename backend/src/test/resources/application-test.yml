# Test chạy trên PostgreSQL thật, database RIÊNG (không dùng chung DB dev)
# để có thể kiểm chứng migration Flyway và các ràng buộc UNIQUE/CHECK.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TEST_DB:grain_warehouse_test}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.grainwarehouse: INFO
