# Test chạy trên PostgreSQL thật, database RIÊNG (không dùng chung DB dev)
# để có thể kiểm chứng migration Flyway và các ràng buộc UNIQUE/CHECK.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_TEST_DB:grain_warehouse_test}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# Khóa riêng cho test — không dùng ở môi trường nào khác
grain:
  auth:
    jwt-secret: test-only-secret-key-at-least-32-bytes-long!!
    # Tắt tạo admin đầu tiên khi test: application.yml nạp ../.env của máy dev, có BOOTSTRAP_ADMIN_* → DB test trống
    # sẽ có thêm một SYSTEM_ADMIN được commit thật, làm UserApiTest "admin cuối cùng" đỏ ở máy dev mà xanh trên CI
    bootstrap-admin-username: ""
    bootstrap-admin-password: ""

logging:
  level:
    com.grainwarehouse: INFO
