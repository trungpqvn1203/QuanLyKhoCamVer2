spring:
  application:
    name: grain-warehouse-backend
  # Đọc file .env ở thư mục gốc dự án (không bắt buộc tồn tại).
  # "../.env" khi chạy từ backend/ (mvn), ".env" khi IDE chạy từ thư mục gốc.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    # Tắt Open Session In View: lazy loading ngoài transaction sẽ lỗi ngay,
    # buộc service map Entity -> DTO bên trong @Transactional
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    # Contract: trường null bị bỏ khỏi JSON, không trả "field": null — áp dụng cho MỌI DTO.
    # @JsonInclude(NON_NULL) trên ApiResponse chỉ có tác dụng với trường của chính lớp đó, không lan vào data.
    default-property-inclusion: non_null
    deserialization:
      # Mặc định Jackson âm thầm cắt 2.5 thành 2 khi field kiểu Integer.
      # Số lượng là số nguyên (BR-INV-07) → gửi 2.5 phải bị từ chối 400, không được thành 2 bao.
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
