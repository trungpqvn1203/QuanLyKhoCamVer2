spring:
  application:
    name: grain-warehouse-backend
  # Đọc file .env ở thư mục gốc dự án (không bắt buộc tồn tại).
  # "../.env" khi chạy từ backend/ (mvn), ".env" khi IDE chạy từ thư mục gốc.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # Nhập Excel: file mẫu 1.000 dòng chỉ vài trăm KB. Mặc định Spring 1MB; Nginx cho tối đa 5m
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    # Tắt Open Session In View: lazy loading ngoài transaction sẽ lỗi ngay,
    # buộc service map Entity -> DTO bên trong @Transactional
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    # Contract: trường null bị bỏ khỏi JSON, không trả "field": null — áp dụng cho MỌI DTO.
    # @JsonInclude(NON_NULL) trên ApiResponse chỉ có tác dụng với trường của chính lớp đó, không lan vào data.
    default-property-inclusion: non_null
    deserialization:
      # Mặc định Jackson âm thầm cắt 2.5 thành 2 khi field kiểu Integer.
      # Số lượng là số nguyên (BR-INV-07) → gửi 2.5 phải bị từ chối 400, không được thành 2 bao.
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}

# Xác thực (ADR-0003). Thời hạn mặc định ở AuthProperties: access 15m, không thao tác 8h, tối đa 24h
grain:
  auth:
    jwt-secret: ${JWT_SECRET:}
    cookie-secure: ${COOKIE_SECURE:true}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
