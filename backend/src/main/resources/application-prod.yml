spring:
  # Production không có giá trị mặc định: thiếu biến môi trường thì backend dừng ngay, không âm thầm nối nhầm DB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT_SECRET bắt buộc: allow-ephemeral-secret mặc định false (AuthProperties)

logging:
  level:
    root: INFO
    com.grainwarehouse: INFO
