spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:grain_warehouse}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Chỉ dev: thiếu JWT_SECRET thì sinh khóa tạm (khởi động lại backend = đăng nhập lại). Production KHÔNG bật
grain:
  auth:
    allow-ephemeral-secret: true

logging:
  level:
    com.grainwarehouse: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
