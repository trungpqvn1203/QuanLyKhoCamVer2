server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Không lộ phiên bản Nginx trong header/trang lỗi
    server_tokens off;
    client_max_body_size 5m;

    # API: chuyển sang container backend. /actuator KHÔNG được chuyển → không lộ ra Internet
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File JS/CSS do Vite build có mã hash trong tên → cache lâu dài an toàn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn không phải file đều trả index.html (F5 ở /inventory không bị 404)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
