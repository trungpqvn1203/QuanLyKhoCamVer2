# Chống dò mật khẩu app khách (ADR-0005 mục 7, BR-POR-04): khóa 5 lần sai chỉ tính TỪNG tài khoản, nên kẻ xấu vẫn
# thử một mật khẩu phổ biến cho mọi SĐT. Giới hạn theo IP chặn kiểu đó. 10 lần/phút + dồn 10: khách thật gõ sai
# vài lần vẫn thoải mái; nhiều khách dùng chung IP nhà mạng (CGNAT) vẫn đủ vì phiên khách sống 30 ngày, ít khi đăng nhập.
# Chỉ áp cho đăng nhập: gia hạn phiên cần refresh token hợp lệ (không dò được) và chạy 15 phút một lần mỗi khách.
limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Không lộ phiên bản Nginx trong header/trang lỗi
    server_tokens off;
    client_max_body_size 5m;

    # Đăng nhập app khách: như /api/ nhưng giới hạn theo IP (khai báo zone ở đầu file). Vượt → 429 + JSON đúng
    # envelope lỗi (contract-spec) để app hiện câu dễ hiểu
    location = /api/portal/auth/login {
        limit_req zone=portal_login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_logins;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @too_many_logins {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"Đăng nhập quá nhiều lần. Vui lòng thử lại sau ít phút"},"timestamp":"$time_iso8601"}';
    }

    # API: chuyển sang container backend. /actuator KHÔNG được chuyển → không lộ ra Internet
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File JS/CSS do Vite build có mã hash trong tên → cache lâu dài an toàn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn không phải file đều trả index.html (F5 ở /inventory không bị 404)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
