# Chạy từ thư mục gốc dự án:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# backend/web có cả `image` lẫn `build`:
#   - Server (CD): deploy.sh `pull` image đã build sẵn trên GitHub, tag = mã commit (IMAGE_TAG trong .env.prod)
#   - Máy local:   `up -d --build` tự build, image được gắn tag "local" (IMAGE_TAG để trống)
name: grain-warehouse-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grain_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-grain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env.prod}
    # Không có "ports": DB không mở ra ngoài, chỉ backend trong mạng internal kết nối được
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Tên phải khớp IMAGE_PREFIX trong .github/workflows/cd.yml
    image: ghcr.io/trungpqvn1203/grain-warehouse-backend:${IMAGE_TAG:-local}
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-grain_warehouse}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-grain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env.prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TZ: Asia/Ho_Chi_Minh
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: ghcr.io/trungpqvn1203/grain-warehouse-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - web
    # Không có healthcheck thì `up --wait` coi web "Healthy" ngay khi container vừa start,
    # lúc entrypoint nginx:alpine chưa mở port 80 → bước kiểm tra của deploy.sh bị Connection refused.
    # 127.0.0.1 thay vì localhost: localhost phân giải ra ::1 trước, mà default.conf chỉ listen IPv4.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  # internal: true → container trong mạng này không ra được Internet và không nhận kết nối từ ngoài
  internal:
    internal: true
  web:

volumes:
  pgdata:
